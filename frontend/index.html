<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>黑盒 2.0 · 遥测大屏</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    :root {
      --bg: #0a0e14;
      --panel: #111820;
      --border: #1e2a3a;
      --accent: #00d4aa;
      --accent2: #3b9eff;
      --warn: #ffb020;
      --danger: #ff4757;
      --text: #e6edf3;
      --muted: #6b7b8c;
      --glow: rgba(0, 212, 170, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ═══════════════════════════════════════════════════════════
       ROOT: 100vh 零滚动单屏
       ═══════════════════════════════════════════════════════ */
    html, body {
      height: 100vh;
      overflow: hidden;
    }

    body {
      font-family: "Segoe UI", "SF Pro Display", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(0, 212, 170, 0.08), transparent),
        linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, 0.4) 100%);
    }

    /* ═══════════════════════════════════════════════════════════
       HEADER — 紧凑工具条
       ═══════════════════════════════════════════════════════════ */
    header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.45rem 0.75rem;
      border-bottom: 1px solid var(--border);
      background: rgba(10, 14, 20, 0.9);
      z-index: 10;
    }

    header h1 {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      flex-shrink: 0;
      white-space: nowrap;
    }

    .replay-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex: 1;
      justify-content: center;
      min-width: 0;
    }

    .replay-toggle {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.68rem;
      letter-spacing: 0.05em;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    .replay-toggle input {
      accent-color: var(--accent);
      width: 13px;
      height: 13px;
      cursor: pointer;
    }

    .replay-toggle.active span { color: var(--warn); }

    #replaySelect {
      font-family: inherit;
      font-size: 0.68rem;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 0.3rem 0.5rem;
      min-width: 180px;
      max-width: 240px;
      cursor: pointer;
    }

    #replaySelect:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #replaySelect option { background: var(--panel); }

    .replay-status {
      font-size: 0.6rem;
      color: var(--warn);
      letter-spacing: 0.04em;
      opacity: 0;
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    .replay-status.visible { opacity: 1; }

    .export-btn {
      font-family: inherit;
      font-size: 0.65rem;
      letter-spacing: 0.05em;
      color: var(--text);
      background: rgba(0, 212, 170, 0.08);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 0.3rem 0.6rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s;
    }

    .export-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: rgba(0, 212, 170, 0.18);
    }

    .export-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* ── 画布暂停拨动开关 ─────────────────────────────── */
    .pause-toggle {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-family: inherit;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--accent);
      background: rgba(0, 212, 170, 0.06);
      border: 1px solid rgba(0, 212, 170, 0.35);
      border-radius: 5px;
      padding: 0.35rem 0.65rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.25s ease;
      user-select: none;
      flex-shrink: 0;
    }

    .pause-toggle:hover {
      border-color: var(--accent);
      background: rgba(0, 212, 170, 0.14);
      box-shadow: 0 0 12px rgba(0, 212, 170, 0.2);
    }

    .pause-toggle.paused {
      color: #ff6b7a;
      background: rgba(231, 76, 60, 0.12);
      border-color: rgba(255, 107, 122, 0.55);
      box-shadow: 0 0 14px rgba(231, 76, 60, 0.35);
      animation: pause-pulse 2s ease-in-out infinite;
    }

    @keyframes pause-pulse {
      0%, 100% { box-shadow: 0 0 14px rgba(231, 76, 60, 0.35); }
      50%      { box-shadow: 0 0 22px rgba(231, 76, 60, 0.6);  }
    }

    .pause-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 7px var(--accent);
      transition: background 0.25s, box-shadow 0.25s;
    }

    .pause-dot.paused {
      background: #ff6b7a;
      box-shadow: 0 0 8px #ff6b7a;
    }

    .conn {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.7rem;
      color: var(--muted);
      flex-shrink: 0;
      white-space: nowrap;
    }

    .conn-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #e74c3c;
      box-shadow: 0 0 6px #e74c3c;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .conn-dot.connecting {
      background: var(--warn);
      box-shadow: 0 0 8px var(--warn);
    }

    .conn-dot.online {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    /* ═══════════════════════════════════════════════════════════
       TOP STRIP — 顶速测距三卡横条
       ═══════════════════════════════════════════════════════════ */
    .top-strip {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.5rem;
      padding: 0.5rem 0.75rem;
    }

    .top-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.45rem 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      position: relative;
      overflow: hidden;
    }

    .top-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), transparent);
    }

    .top-card label {
      font-size: 0.6rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }

    .top-card .value {
      font-size: 1.35rem;
      font-weight: 300;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .top-card.steer .value { color: var(--accent2); }
    .top-card.throttle .value { color: var(--accent); }

    /* 模式切换器 (在 top-card 内) */
    .mode-switcher {
      display: flex;
      gap: 0;
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .mode-btn {
      flex: 1;
      font-family: inherit;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: var(--muted);
      background: transparent;
      border: none;
      padding: 0.35rem 0.5rem;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, box-shadow 0.2s;
      white-space: nowrap;
    }

    .mode-btn:not(:last-child) { border-right: 1px solid var(--border); }

    .mode-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.03);
    }

    .mode-btn.mode-active {
      color: #fff;
      font-weight: 600;
    }

    .mode-btn.mode-manual.mode-active {
      background: rgba(59, 158, 255, 0.25);
      box-shadow: inset 0 -2px 0 var(--accent2);
    }

    .mode-btn.mode-semi.mode-active {
      background: rgba(255, 176, 32, 0.25);
      box-shadow: inset 0 -2px 0 var(--warn);
    }

    .mode-btn.mode-auto.mode-active {
      background: rgba(0, 212, 170, 0.25);
      box-shadow: inset 0 -2px 0 var(--accent);
    }

    /* ═══════════════════════════════════════════════════════════
       MAIN GRID — 核心双栏：左 65% 感知 + 右 35% 控制台
       ═══════════════════════════════════════════════════════════ */
    .main-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 67fr 33fr;
      gap: 0.5rem;
      padding: 0 0.75rem 0.5rem;
    }

    /* ── 左栏：OAK-D (上) + LiDAR (下) ────────────────── */
    .left-col {
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    /* ── 右栏：欧拉角 → 速度 → 姿态 → 控制台 ──────────── */
    .right-col {
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    /* ── OAK-D 视觉占位框 ─────────────────────────────── */
    .vision-placeholder {
      flex: 45;
      min-height: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .vision-inner {
      position: relative;
      aspect-ratio: 16 / 9;
      max-height: 100%;
      max-width: 100%;
      background: #05090f;
      border: 1px solid rgba(30, 42, 58, 0.5);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .vision-inner::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0, 212, 170, 0.012) 2px,
          rgba(0, 212, 170, 0.012) 4px
        );
      pointer-events: none;
    }

    .vision-inner::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(0, 212, 170, 0.12), transparent);
      animation: vision-scan 4s ease-in-out infinite;
    }

    @keyframes vision-scan {
      0%, 100% { top: 0; opacity: 0.2; }
      50%      { top: calc(100% - 2px); opacity: 0.7; }
    }

    .vision-text {
      font-size: clamp(0.6rem, 1vw, 0.8rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      color: #24303a;
      text-align: center;
      padding: 1rem;
      z-index: 1;
      transition: color 0.3s;
      user-select: none;
    }

    .vision-inner:hover .vision-text { color: #354858; }

    /* ── LiDAR 感知面板 ────────────────────────────────── */
    .lidar-panel {
      flex: 55;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid rgba(0, 212, 170, 0.22);
      border-radius: 6px;
      padding: 0.4rem 0.6rem 0.3rem;
      box-shadow: 0 0 18px rgba(0, 212, 170, 0.05);
    }

    .lidar-panel h2 {
      flex-shrink: 0;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 0.15rem;
      padding-left: 0.2rem;
    }

    .lidar-panel .chart-box {
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    /* ── 欧拉角三连卡 ─────────────────────────────────── */
    .euler-cards {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.4rem;
    }

    .card.euler {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 0.4rem 0.55rem;
      position: relative;
      overflow: hidden;
    }

    .card.euler::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent2), transparent);
    }

    .card.euler label {
      display: block;
      font-size: 0.55rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.15rem;
    }

    .card.euler .value {
      font-size: 1.15rem;
      font-weight: 300;
      font-variant-numeric: tabular-nums;
      color: var(--accent2);
      line-height: 1.1;
    }

    /* ── 右侧图表面板 (speed / gyro) ──────────────────── */
    .chart-panel {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 0.35rem 0.55rem 0.25rem;
    }

    .chart-panel h2 {
      flex-shrink: 0;
      font-size: 0.6rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 0.1rem;
      padding-left: 0.15rem;
    }

    .chart-panel .chart-box {
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    /* ── 控制台 (右侧底部) ────────────────────────────── */
    .control-section {
      flex-shrink: 0;
      position: relative;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 0.4rem;
    }

    /* 全自动模式遮罩 */
    .control-mask {
      position: absolute;
      inset: 0;
      background: rgba(10, 14, 20, 0.78);
      backdrop-filter: blur(2px);
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .control-mask.visible { opacity: 1; }

    .control-mask span {
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      color: var(--accent);
      font-weight: 500;
      text-align: center;
    }

    .control-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.3rem;
      margin-bottom: 0.3rem;
    }

    .control-btn {
      font-family: inherit;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: var(--text);
      background: rgba(0, 212, 170, 0.06);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.4rem 0.3rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
      position: relative;
    }

    .control-btn:hover {
      border-color: var(--accent);
      background: rgba(0, 212, 170, 0.12);
    }

    .control-btn.active {
      border-color: var(--accent);
      background: var(--glow);
      box-shadow: 0 0 10px var(--glow);
    }

    .control-btn kbd {
      display: block;
      font-size: 0.55rem;
      color: var(--muted);
      margin-top: 0.1rem;
      font-weight: 400;
    }

    .estop-btn {
      width: 100%;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #fff;
      background: linear-gradient(180deg, #ff4757 0%, #c0392b 100%);
      border: 1.5px solid #ff6b7a;
      border-radius: 5px;
      padding: 0.5rem;
      cursor: pointer;
      box-shadow: 0 0 14px rgba(231, 76, 60, 0.4);
      transition: transform 0.1s, box-shadow 0.15s;
    }

    .estop-btn:hover {
      box-shadow: 0 0 22px rgba(231, 76, 60, 0.6);
    }

    .estop-btn:active,
    .estop-btn.active {
      transform: scale(0.97);
      box-shadow: 0 0 28px rgba(231, 76, 60, 0.8);
    }

    .estop-btn kbd {
      display: block;
      font-size: 0.55rem;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 0.1rem;
      font-weight: 400;
      letter-spacing: 0.06em;
    }

    /* ═══════════════════════════════════════════════════════════
       AEB 脊髓反射 · 固定叠加横幅 (不挤占布局)
       ═══════════════════════════════════════════════════════════ */
    @keyframes aeb-pulse {
      0%, 100% { box-shadow: inset 0 0 0 3px rgba(231, 76, 60, 0); }
      50%      { box-shadow: inset 0 0 0 3px rgba(231, 76, 60, 0.92); }
    }

    body.aeb-alert {
      animation: aeb-pulse 0.75s ease-in-out infinite;
    }

    .aeb-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: linear-gradient(90deg, rgba(231, 76, 60, 0.25), rgba(231, 76, 60, 0.1), rgba(231, 76, 60, 0.25));
      border-bottom: 1px solid rgba(231, 76, 60, 0.55);
      padding: 0.5rem 1rem;
      animation: aeb-banner-flash 1s ease-in-out infinite;
    }

    @keyframes aeb-banner-flash {
      0%, 100% { opacity: 0.85; }
      50%      { opacity: 1; }
    }

    .aeb-overlay.visible {
      display: flex;
    }

    .aeb-overlay-text {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #ff6b7a;
    }

    /* ═══════════════════════════════════════════════════════════
       响应式退阶
       ═══════════════════════════════════════════════════════════ */
    @media (max-width: 900px) {
      .main-grid {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }
    }

    @media (max-width: 600px) {
      header {
        flex-wrap: wrap;
        gap: 0.35rem;
        padding: 0.35rem 0.5rem;
      }
      header h1 { font-size: 0.8rem; }
      .top-strip { grid-template-columns: 1fr; }
      .euler-cards { grid-template-columns: repeat(3, 1fr); }
      .control-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <!-- ══════ HEADER · 工具条 ══════ -->
  <header>
    <h1>黑盒 2.0 · 遥测大屏</h1>

    <div class="replay-bar">
      <label class="replay-toggle" id="replayToggleLabel">
        <input type="checkbox" id="replayToggle" />
        <span>复盘</span>
      </label>
      <select id="replaySelect" disabled>
        <option value="">— 选择实验批次 —</option>
      </select>
      <button type="button" class="export-btn" id="exportBtn">⬇ 导出</button>
      <span class="replay-status" id="replayStatus">⏳ 历史回放中</span>
    </div>

    <button type="button" class="pause-toggle" id="pauseToggle" title="冻结画布以便汇报讲解">
      <span class="pause-dot" id="pauseDot"></span>
      <span id="pauseLabel">画布渲染：实时</span>
    </button>

    <div class="conn">
      <span class="conn-dot" id="connDot"></span>
      <span id="connLabel">未连接</span>
    </div>
  </header>

  <!-- ══════ TOP STRIP · 速测模式三卡 ══════ -->
  <div class="top-strip">
    <div class="top-card steer">
      <label>SPEED_MPS</label>
      <div class="value" id="valSteer">—</div>
    </div>
    <div class="top-card throttle">
      <label>LIDAR_FRONT</label>
      <div class="value" id="valThrottle">—</div>
    </div>
    <div class="top-card">
      <label>RUN_MODE</label>
      <div class="mode-switcher" id="modeSwitcher">
        <button type="button" class="mode-btn mode-manual mode-active" data-mode="MANUAL">手动</button>
        <button type="button" class="mode-btn mode-semi" data-mode="SEMI_AUTO">半自动</button>
        <button type="button" class="mode-btn mode-auto" data-mode="AUTO">全自动</button>
      </div>
    </div>
  </div>

  <!-- ══════ MAIN GRID · 双栏核心 ══════ -->
  <div class="main-grid">

    <!-- ── 左栏 67%：OAK-D 视觉预留 (上) + LiDAR 360° 点云 (下) ── -->
    <div class="left-col">

      <div class="vision-placeholder">
        <div class="vision-inner">
          <span class="vision-text">[ OAK-D Lite 视觉 AI 推流通道 - 硬件就绪后激活 ]</span>
        </div>
      </div>

      <div class="lidar-panel">
        <h2>感知 · lidar_360 · 极坐标点云 BEV</h2>
        <div class="chart-box" id="chartLidar"></div>
      </div>

    </div>

    <!-- ── 右栏 33%：欧拉角 → 图表 → 控制台 ── -->
    <div class="right-col">

      <div class="euler-cards">
        <div class="card euler">
          <label>YAW · 偏航</label>
          <div class="value" id="valYaw">0.00</div>
        </div>
        <div class="card euler">
          <label>PITCH · 俯仰</label>
          <div class="value" id="valPitch">0.00</div>
        </div>
        <div class="card euler">
          <label>ROLL · 横滚</label>
          <div class="value" id="valRoll">0.00</div>
        </div>
      </div>

      <div class="chart-panel">
        <h2>speed_mps (m/s)</h2>
        <div class="chart-box" id="chartControl"></div>
      </div>

      <div class="chart-panel">
        <h2>gyro_z_rads (rad/s)</h2>
        <div class="chart-box" id="chartGyro"></div>
      </div>

      <div class="control-section">
        <div class="control-mask" id="controlMask"><span>AI 控制中<br/>按 WASD 接管</span></div>
        <div class="control-grid">
          <button type="button" class="control-btn" data-action="FORWARD">前进<kbd>W</kbd></button>
          <button type="button" class="control-btn" data-action="BACKWARD">后退<kbd>S</kbd></button>
          <button type="button" class="control-btn" data-action="LEFT">左转<kbd>A</kbd></button>
          <button type="button" class="control-btn" data-action="RIGHT">右转<kbd>D</kbd></button>
        </div>
        <button type="button" class="estop-btn" data-action="E_STOP">E-STOP<kbd>E</kbd></button>
      </div>

    </div>
  </div>

  <!-- ══════ AEB 叠加横幅 (不挤占布局) ══════ -->
  <div class="aeb-overlay" id="aebBanner">
    <span class="aeb-overlay-text">⚠ 距障碍物 &lt; 0.2m，底层 AEB 强制介入截断动力！</span>
  </div>

  <script src="js/dashboard.js"></script>
</body>
</html>
